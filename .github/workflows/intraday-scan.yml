name: Intraday Scan

on:
  # Manual dispatch only -- see swing-scan.yml for why there's no `schedule:`.
  workflow_dispatch:
    inputs:
      fast:
        description: "Fast mode (scan only yesterday's/prior top-20 instead of full universe)"
        type: boolean
        default: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run intraday scan
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ inputs.fast }}" = "true" ]; then
            python intraday_main.py --fast
          else
            python intraday_main.py
          fi
