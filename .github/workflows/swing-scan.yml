name: Swing Scan

on:
  # Manual dispatch only. A `schedule:` block belongs here for unattended daily
  # runs (e.g. cron "17 10 * * 1-5" for ~15:47 IST, offset off the hour to dodge
  # GitHub's documented top-of-hour delays), but this is a demo deployment --
  # running it unattended would spend Gemini quota every day whether or not
  # anyone is looking at the output.
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run swing scan
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py
