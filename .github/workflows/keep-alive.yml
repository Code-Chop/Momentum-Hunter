name: Keep API Awake

# Render's free tier suspends a service after ~15 minutes without traffic, and
# waking it costs the next visitor 30-50s. A cheap periodic request keeps it
# warm during the hours someone might actually open the dashboard.
#
# Deliberately NOT 24/7: the free tier allows 750 instance-hours a month and a
# month is ~730 hours, so holding one service awake round the clock consumes
# essentially the entire allowance. This window is ~14h/day (~420h/month),
# which leaves headroom.
on:
  schedule:
    # Every 10 min, 03:00-16:59 UTC (08:30-22:29 IST). GitHub delays scheduled
    # runs under load, so treat this as best-effort rather than exact.
    - cron: "*/10 3-16 * * *"
  workflow_dispatch: {}

# A slow wake-up shouldn't pile up overlapping runs.
concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          API_URL: ${{ secrets.API_BASE_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "API_BASE_URL secret is not set — nothing to ping."
            exit 1
          fi
          # --max-time is generous: a cold start legitimately takes ~50s.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 "$API_URL/health" || echo "000")
          echo "GET $API_URL/health -> $code"
          [ "$code" = "200" ]
